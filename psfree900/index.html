<!DOCTYPE html>
<html>
<head>
<title>PS4 9.00 GoldHEN | Psfree + Payloads</title>
<link rel="stylesheet" href="../style.css">
<style>
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-color: #1a1a1a; color: white; font-family: sans-serif; }
    #menu { display: flex; flex-direction: column; gap: 12px; width: 300px; }
    .btn { padding: 10px; cursor: pointer; border: 1px solid #555; background: #333; color: white; border-radius: 4px; }
    .btn:hover { background: #444; border-color: gold; }
    .btn-gold { border: 2px solid gold; color: gold; font-weight: bold; }
    hr { width: 80%; opacity: 0.3; }
</style>
</head>
<body>

<h1 id="msgs">PS4 9.00 Exploit (Psfree)</h1>
<hr>

<div id="menu">
    <h3 style="color: gold; margin-bottom: 5px;">PASO 1: Jailbreak</h3>
    <button class="btn btn-gold" onclick="run_payload('goldhen.bin')">ACTIVAR GOLDHEN</button>
    
    <div style="margin: 10px 0;"></div>
    
    <h3 style="color: #aaa; margin-bottom: 5px;">PASO 2: Payloads</h3>
    <button class="btn" onclick="run_payload('ftp.bin')">Servidor FTP</button>
    <button class="btn" onclick="run_payload('appmounter.bin')">App Mounter</button>
    <button class="btn" onclick="run_payload('disableupdates.bin')">Bloquear Updates</button>
</div>

<script>
    function run_payload(nombreBin) {
        // Guardamos el nombre del payload en una variable global que el exploit pueda leer
        window.selected_payload = nombreBin; 
        
        msgs.innerHTML = "Lanzando exploit para " + nombreBin + "...";
        
        // Eliminamos scripts previos si existen para evitar conflictos
        let oldScript = document.getElementById('exploit_script');
        if(oldScript) oldScript.remove();

        // Cargamos el lanzador original (alert.mjs)
        let script = document.createElement('script');
        script.id = 'exploit_script';
        script.type = 'module';
        script.src = 'alert.mjs'; 
        document.body.appendChild(script);
    }
</script>

</body>
</html>
