<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
    <title>Instalando Caché Offline...</title>
    <style>
        /* Estilo oscuro y centrado a juego con el menú */
        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            background-color: #111; color: white; font-family: sans-serif;
        }
        #progress { font-size: 28px; color: gold; font-weight: bold; }
        .loader {
            border: 4px solid #333; border-top: 4px solid gold;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 22px; color: #888; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1 id="progress">Instalando Menú: 0%</h1>
    <h1 id="msgs">Espere un momento...</h1>

    <script>
        // Limpiamos el historial para que no se quede atrapado en el instalador
        history.replaceState(null,null,'index.html');
        var histlength=history.length;
        history.go(-histlength);

        // Función que calcula el porcentaje de descarga
        window.applicationCache.addEventListener("progress", function(e) {
            var percent = Math.round(e.loaded / e.total * 100);
            document.getElementById("progress").innerHTML = "Instalando Menú: " + percent + "%";
        }, false);

        // Cuando termina, avisa al usuario
        window.applicationCache.oncached = function(e) {
            document.getElementById("progress").innerHTML = "¡Caché Instalada! ✔";
            document.getElementById("msgs").innerHTML = "Cierra el navegador y vuelve a entrar.";
        };

        // Si ya estaba instalada y solo se actualizó
        window.applicationCache.onupdateready = function(e) {
            document.getElementById("progress").innerHTML = "¡Menú Actualizado! ✔";
            document.getElementById("msgs").innerHTML = "Reinicia el navegador para ver los cambios.";
        };
    </script>
</body>
</html>
