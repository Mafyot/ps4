<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
    <title>Instalando...</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #111; color: white; font-family: sans-serif; }
        #progress { font-size: 28px; color: gold; font-weight: bold; }
    </style>
</head>
<body>
    <h1 id="progress">Instalando Menú: 0%</h1>
    <script>
        history.replaceState(null,null,'index.html');
        window.applicationCache.addEventListener("progress", function(e) {
            var percent = Math.round(e.loaded / e.total * 100);
            document.getElementById("progress").innerHTML = "Instalando Menú: " + percent + "%";
        }, false);
        window.applicationCache.oncached = function() {
            document.getElementById("progress").innerHTML = "¡Caché Instalada! ✔<br>Reinicia el navegador.";
        };
        window.applicationCache.onupdateready = function() { location.reload(); };
    </script>
</body>
</html>
