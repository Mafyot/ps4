<!DOCTYPE html>
<html>
<head>
<title>PS4 9.00 GoldHEN Host | Psfree + Lapse</title>

<style>
    body {
        background-color: #000b1a; 
        background-image: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
        background-attachment: fixed;
        background-size: cover;
        color: white;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 40px 20px;
    }

    hr { border: 1px solid #f31414; width: 60%; margin: 20px auto; }

    #msgs {
        font-size: 30px;
        margin-top: 40px;
        margin-bottom: 40px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        color: white;
    }

    .btn-container {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }

    .btn {
        background: #f31414;
        color: white;
        padding: 15px 40px;
        border: 2px solid transparent;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        min-width: 220px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .btn:hover {
        background: white;
        color: #f31414;
        border: 2px solid #f31414;
        transform: scale(1.05);
    }
</style>
</head>

<body>
<script>
    if (window.applicationCache.status=='0'){window.location.replace("cache.html");}
</script>

<pre id='console'></pre>

<h1>PS4 9.00 GoldHEN Host</h1>
<hr>

<h1 id="msgs">Esperando para Cargar Payload...</h1>

<div class="btn-container">
    <!-- Aquí he cambiado el onclick para que llame a los archivos .bin -->
    <button class="btn" onclick="load_payload('goldhen.bin')">Cargar GoldHEN</button>
    <button class="btn" onclick="load_payload('cheats.bin')">Menú Trampas</button>
    <button class="btn" onclick="load_payload('webRTE.bin')">WebRTE</button>
</div>

<script>
    // Función para manejar la carga de los archivos .bin
    function load_payload(payload_name) {
        document.getElementById("msgs").innerHTML = "Cargando " + payload_name + "... Por favor, espere";
        
        // Esta función debe existir en tus archivos .js/mjs originales
        // Si usas el sistema de GamerHack, generalmente la función es 'runPayload' o 'load_payload'
        if (typeof runPayload !== "undefined") {
            runPayload(payload_name);
        } else {
            // Intento alternativo según la estructura estándar
            location.href = payload_name; 
        }
    }
</script>

<script type='module' src='alert.mjs'></script>
</body>
</html>
