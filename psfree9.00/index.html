<!DOCTYPE html>
<html>
<head>
<title>PS4 9.00 GoldHEN Host | Psfree + Lapse</title>
<style>
    body {
        background-image: url('../img.jpg'); 
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-color: #000b1a; 
        color: white;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 40px 20px;
        height: 100vh;
        overflow: hidden;
    }
    hr { border: 1px solid #f31414; width: 60%; margin: 20px auto; }
    #msgs { font-size: 30px; margin-top: 40px; margin-bottom: 40px; text-shadow: 2px 2px 8px black; }
    .btn-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
    .btn {
        background: #003263; color: white; padding: 15px 40px; border: none;
        border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
        min-width: 220px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s ease;
    }
    .btn:hover { background: #0069d9; transform: scale(1.05); }
</style>
</head>
<!-- ... tus estilos CSS se mantienen igual ... -->
<body>
<script>
    if (window.applicationCache.status=='0'){window.location.replace("cache.html");}

    function lanzar_payload(archivo) {
        // Mostramos que estamos preparando el salto
        document.getElementById("msgs").innerHTML = "Enviando: " + archivo;
        
        // Redirigimos a cargar.html pasando el nombre exacto
        setTimeout(function(){
            window.location.href = "cargar.html?p=" + archivo;
        }, 300);
    }
</script>

<h1>PS4 9.00 GoldHEN Host</h1>
<hr>
<h1 id="msgs">Seleccione un Payload</h1>

<div class="btn-container">
    <!-- Usamos el nombre exacto en minúsculas -->
    <button class="btn" onclick="lanzar_payload('goldhen.bin')">Cargar GoldHEN</button>
</div>
</body>
</html>
