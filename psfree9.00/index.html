<!DOCTYPE html>
<html>
<head>
<title>PS4 9.00 GoldHEN Host | Psfree + Lapse</title>
<style>
    body {
        background-image: url('../img.jpg'); 
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-color: #000b1a; 
        color: white;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 40px 20px;
        height: 100vh;
        overflow: hidden;
    }
    #console { display: none; }
    hr { border: 1px solid #f31414; width: 60%; margin: 20px auto; }
    #msgs { font-size: 30px; margin: 40px 0; text-shadow: 2px 2px 8px black; }
    .btn-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
    .btn {
        background: #003263; color: white; padding: 15px 40px; border: none;
        border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
        min-width: 220px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .btn:hover { background: #0069d9; transform: scale(1.05); }
</style>
</head>
<body>
<pre id="console"></pre>

<script>
    if (window.applicationCache.status=='0'){window.location.replace("cache.html");}
</script>

<h1>PS4 9.00 GoldHEN Host</h1>
<hr>
<h1 id="msgs">Esperando para Cargar Payload...</h1>

<div class="btn-container">
    <button class="btn" onclick="lanzar_payload('goldhen.bin')">Cargar GoldHEN</button>
    <button class="btn" onclick="lanzar_payload('cheats.bin')">Menú Trampas</button>
    <button class="btn" onclick="lanzar_payload('webRTE.bin')">WebRTE</button>
</div>

<script type="module">
    // Importamos directamente el motor desde psfree.mjs
    import * as psfree from './psfree.mjs';

    window.lanzar_payload = function(nombre_bin) {
        document.getElementById("msgs").innerHTML = "Enviando " + nombre_bin + "...";
        
        // En los hosts de Psfree, la función suele llamarse run o loadPayload
        // Intentamos ejecutarla desde el módulo importado
        try {
            if (psfree.run) {
                psfree.run(nombre_bin);
            } else if (psfree.loadPayload) {
                psfree.loadPayload(nombre_bin);
            } else {
                // Si el módulo no deja usar la función, la llamamos vía URL controlada
                window.location.hash = nombre_bin; 
                // Nota: Algunos hosts de Psfree cargan el .bin al detectar el hash
            }
        } catch(e) {
            alert("Error al conectar con psfree.mjs: " + e);
        }
    };
</script>

<!-- Cargamos el manejador de errores original -->
<script type='module' src='alert.mjs'></script>

</body>
</html>
