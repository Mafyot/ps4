<body>
<script>
    if (window.applicationCache.status=='0'){window.location.replace("cache.html");}

<h1 id="msgs">Esperando para Cargar Payload...</h1>

    <button class="btn" onclick="lanzar_payload('goldhen.bin')">Cargar GoldHEN</button>

<script type="module">
    // Importamos TODO lo que exporta alert.mjs
    import * as host de './alert.mjs';

    // Hacemos que la función sea visible para los botones del HTML
    window.lanzar_payload = function(nombre_bin) {
        document.getElementById("msgs").innerHTML = "Enviando " + nombre_bin + "...";
        
        // Buscamos la función de carga dentro del archivo de GamerHack
        // Normalmente se llama 'loadPayload' o 'runPayload'
        if (host.loadPayload) {
            host.loadPayload(nombre_bin);
        } else if (host.runPayload) {
            host.runPayload(nombre_bin);
        } else {
            // Si el nombre es distinto, lo forzamos por URL (pero esto suele dar pantalla blanca)
            location.href = nombre_bin;
        }
    };
</script>

<!-- Cargamos el motor del exploit -->
<script type='module' src='alert.mjs'></script>
