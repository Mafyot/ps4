<!DOCTYPE html>
<html>
<head>
<title>PS4 9.00 GoldHEN Host | Psfree + Lapse</title>

<style>
    body {
        /* CORRECCIÓN: Fondo con tu imagen original */
        background-image: url('../img.jpg'); 
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-color: #000b1a; 
        color: white;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 40px 20px;
        height: 100vh;
        overflow: hidden;
    }

    hr { border: 1px solid #f31414; width: 60%; margin: 20px auto; }

    #msgs {
        font-size: 30px;
        margin-top: 40px;
        margin-bottom: 40px;
        text-shadow: 2px 2px 8px black;
        color: white;
    }

    .btn-container {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }

    .btn {
        background: #f31414;
        color: white;
        padding: 15px 40px;
        border: 2px solid transparent;
        border-radius: 8px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
        min-width: 220px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .btn:hover {
        background: white;
        color: #f31414;
        transform: scale(1.05);
    }
</style>
</head>

<body>
<script>
    if (window.applicationCache.status=='0'){window.location.replace("cache.html");}
</script>

<pre id='console'></pre>

<h1>PS4 9.00 GoldHEN Host</h1>
<hr>

<h1 id="msgs">Esperando para Cargar Payload...</h1>

<div class="btn-container">
    <!-- Si vas a usar carpetas, recuerda poner 'payloads/goldhen.bin' -->
    <button class="btn" onclick="load_payload('goldhen.bin')">Cargar GoldHEN</button>
    <button class="btn" onclick="load_payload('cheats.bin')">Menú Trampas</button>
    <button class="btn" onclick="load_payload('webRTE.bin')">WebRTE</button>
</div>

<!-- LÓGICA DE CARGA CORREGIDA -->
<script>
    function load_payload(payload_name) {
        document.getElementById("msgs").innerHTML = "Cargando " + payload_name + "...";
        
        // Buscamos la función que suele inyectar alert.mjs o los scripts de GamerHack
        if (window.runPayload) {
            window.runPayload(payload_name);
        } else if (window.PL_Type) { 
            // Algunos hosts usan este formato
            window.payloadfile = payload_name;
            window.loadPayload();
        } else {
            // Si llega aquí y sale pantalla blanca, falta un archivo .js de soporte
            alert("Error: El motor de carga no está listo. Revisa alert.mjs");
        }
    }
</script>

<script type='module' src='alert.mjs'></script>
</body>
</html>
