<!DOCTYPE html>
<html>
<head>

    <style>

        }
        #msgs { font-size: 30px; text-shadow: 0 0 10px red; }
        /* Consola invisible para que psfree.mjs pueda escribir sin dar error */

        }

</head>
<body>
    <!-- ESTO ES LO QUE FALTA Y EVITA EL ERROR NULL -->
    <pre id="console"></pre>

    <h1 id="msgs">Iniciando Exploit... Espere</h1>

    <script>
        // Leemos el payload de la URL
        var urlParams = new URLSearchParams(window.location.search);
        window.nombrePayload = urlParams.get('p'); 

        // Pequeña pausa para que el DOM (la consola) esté listo
        setTimeout(function(){
            var script = document.createElement('script');
            script.type = 'module';
            script.src = 'alert.mjs'; 
            document.body.appendChild(script);
        }, 300);
    </script>
</body>
