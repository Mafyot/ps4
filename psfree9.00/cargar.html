<!DOCTYPE html>
<html>
<head>
    <title>Cargando...</title>
    <style>
        body { background: #000b1a; color: white; font-family: sans-serif; text-align: center; padding-top: 100px; }
        #msgs { font-size: 25px; text-shadow: 0 0 10px red; }
        #console { display: block; opacity: 0; height: 1px; }
    </style>
</head>
<body>
    <pre id="console"></pre>
    <h1 id="msgs">Iniciando Exploit...</h1>

    <script>
        // LEEMOS DE LA MEMORIA INTERNA
        const pName = localStorage.getItem('payload_a_cargar');

        if (!pName) {
            document.getElementById("msgs").innerHTML = "Error: No hay payload en memoria.<br>Vuelve al menú principal.";
        } else {
            // Variables para el motor Lapse / Psfree
            window.nombrePayload = pName;
            window.payloadfile = pName;
            
            document.getElementById("msgs").innerHTML = "Inyectando: " + pName + "<br>Espere...";

            // Lanzamos el motor de GamerHack
            setTimeout(function(){
                var script = document.createElement('script');
                script.type = 'module';
                script.src = 'alert.mjs'; 
                document.body.appendChild(script);
            }, 500);
        }
    </script>
</body>
</html>
