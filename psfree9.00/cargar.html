<!DOCTYPE html>
<html>
<head>
    <title>Cargando...</title>
    <style>
        body { background: black; color: white; font-family: sans-serif; text-align: center; padding-top: 150px; margin: 0; }
        #msgs { font-size: 25px; text-shadow: 0 0 10px red; }
        #console { display: none; }
    </style>
</head>
<body>
    <pre id="console"></pre>
    <h1 id="msgs">Estabilizando Memoria RAM...</h1>

    <script>
        // Forzamos limpieza de memoria si el navegador lo permite
        if (window.gc) window.gc();

        const pName = localStorage.getItem('payload_a_cargar');

        if (pName && !sessionStorage.getItem('exploit_lanzado')) {
            sessionStorage.setItem('exploit_lanzado', 'true');
            window.nombrePayload = pName;
            window.payloadfile = pName;

            // Espera larga de 2.5 segundos. Es aburrido, pero asegura el éxito.
            setTimeout(function(){
                document.getElementById("msgs").innerHTML = "Inyectando " + pName + "...";
                var script = document.createElement('script');
                script.type = 'module';
                script.src = 'alert.mjs'; 
                document.body.appendChild(script);
            }, 2500); 
        }
    </script>
</body>
</html>
