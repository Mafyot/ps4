<!DOCTYPE html>
<html>
<head>
    <title>Cargando...</title>
    <style>
        body { background: #000b1a; color: white; font-family: sans-serif; text-align: center; padding-top: 100px; }
        #msgs { font-size: 25px; text-shadow: 0 0 10px red; }
        #console { display: block; opacity: 0; height: 1px; }
    </style>
</head>
<body>
    <pre id="console"></pre>
    <h1 id="msgs">Iniciando Exploit...</h1>

    <script>
        // 1. Obtenemos el nombre del payload de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const pName = urlParams.get('p');

        // 2. IMPORTANTE: Lapse y Psfree buscan estas variables globales
        window.nombrePayload = pName; 
        window.payloadfile = pName;
        
        // 3. Forzamos que la PS4 cargue el motor de errores y el exploit
        async function iniciar() {
            try {
                // Verificamos si el archivo existe antes de lanzar el exploit
                const response = await fetch(pName);
                if (!response.ok) throw new Error("No existe el archivo .bin");

                document.getElementById("msgs").innerHTML = "Inyectando " + pName + "...<br>No toques el mando";
                
                var script = document.createElement('script');
                script.type = 'module';
                script.src = 'alert.mjs'; 
                document.body.appendChild(script);
            } catch (err) {
                document.getElementById("msgs").innerHTML = "<span style='color:yellow'>ERROR: No se encontró el archivo: " + pName + "</span><br>Revisa que el nombre sea igual en el USB/Host.";
            }
        }

        window.onload = () => { setTimeout(iniciar, 500); };
    </script>
</body>
</html>
