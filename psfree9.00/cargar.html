<!DOCTYPE html>
<html>
<head>
    <title>Cargando...</title>
    <style>
        body { background: #000b1a; color: white; font-family: sans-serif; text-align: center; padding-top: 100px; }
        #msgs { font-size: 25px; text-shadow: 0 0 10px red; }
        #console { display: block; opacity: 0; height: 1px; }
    </style>
</head>
<body>
    <pre id="console"></pre>
    <h1 id="msgs">Preparando Exploit...</h1>

    <script>
        // Capturamos el nombre del payload desde la URL
        const params = new URLSearchParams(window.location.search);
        const pName = params.get('p');

        if (!pName || pName === "null") {
            document.getElementById("msgs").innerHTML = "Error: No se recibió el nombre del archivo.";
        } else {
            // Definimos las variables que Lapse y Psfree necesitan
            window.nombrePayload = pName;
            window.payloadfile = pName;
            
            document.getElementById("msgs").innerHTML = "Inyectando: " + pName + "<br>Espere a que termine el proceso...";

            // Lanzamos el motor de GamerHack
            setTimeout(function(){
                var script = document.createElement('script');
                script.type = 'module';
                script.src = 'alert.mjs'; 
                document.body.appendChild(script);
            }, 500);
        }
    </script>
</body>
</html>
