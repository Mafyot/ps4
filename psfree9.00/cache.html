<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<title>PS4 9.00 GoldHEN Host | Instalando...</title>
<style>
    body {
        background-image: url('../img.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-color: #24272b;
        color: white;
        font-family: sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }
    h1 { text-shadow: 0.1em 0.1em 0.2em black; }
    hr { border: 1px solid #f31414; width: 50%; margin: 20px auto; }
    #msgs { font-size: 30px; text-shadow: 2px 2px 8px black; }
</style>
<script>
    history.replaceState(null,null,'index.html');
    var histlength=history.length;
    history.go(-histlength);

    function DLProgress(e){
        Percent=(Math.round(e.loaded / e.total * 100));
        window.msgs.innerHTML="Instalando Caché Offline: " + Percent + "%";
    }

    function DisplayCacheProgress(){
        window.msgs.innerHTML="¡Caché Instalada con Éxito! ✔";
        setTimeout(function(){
            window.msgs.innerHTML="Cierra y Reabre el Navegador ahora...";
        }, 2500);
    }

    window.applicationCache.addEventListener("progress",DLProgress,false);
    window.applicationCache.oncached=function(e){DisplayCacheProgress();};
    window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>
</head>
<body>
    <h1>PS4 9.00 FW GoldHEN Host</h1>
    <hr>
    <h1 id="msgs">Preparando archivos...</h1>
</body>
</html>
