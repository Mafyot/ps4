<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<title>PS4 9.00 GoldHEN Host | Psfree + Lapse</title>
<link rel="stylesheet" href="../style.css">

<style>
    /* Mismo estilo visual que el index para coherencia */
    body {
        background-color: #000b1a;
        background-image: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
        color: white;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 80vh; /* Centra el contenido verticalmente */
    }

    #msgs {
        font-size: 35px;
        font-weight: bold;
        text-shadow: 0 0 10px #f31414; /* Brillo rojo */
        margin-bottom: 20px;
    }

    hr {
        width: 50%;
        border: 1px solid #f31414;
        margin-bottom: 50px;
    }

    .loader-info {
        font-size: 20px;
        color: #cccccc;
    }
</style>

<script>
    history.replaceState(null,null,'index.html');
    var histlength=history.length;
    history.go(-histlength);

    function DLProgress(e){
        Percent=(Math.round(e.loaded / e.total * 100));
        setTimeout(function(){
            window.msgs.innerHTML="Instalando Caché Offline: " + Percent + "%";
        },500);
    }

    function DisplayCacheProgress(){
        setTimeout(function(){
            window.msgs.innerHTML="¡Caché Instalada con Éxito! ✔";
        },1500);
        setTimeout(function(){
            window.msgs.innerHTML="Cierra y Reabre el Navegador...";
        },3500);
    }

    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e){ DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e){ DisplayCacheProgress(); };
</script>
</head>

<body>
    <h1>PS4 9.00 FW GoldHEN Host</h1>
    <hr>
    
    <div id="msgs">Espere un momento...</div>
    <div class="loader-info">Preparando archivos para uso offline</div>

</body>
</html>
