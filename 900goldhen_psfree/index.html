<!DOCTYPE html>
<html>
<head>
<title>PS4 9.00 GoldHEN | Psfree + Lapse</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
if (window.applicationCache.status=='0'){window.location.replace("cache.html");}
</script>
<pre id='console'></pre>
<h1>PS4 9.00 GoldHEN | Psfree + Lapse</h1>
<hr>
<br>

<!-- PANTALLA DE CARGA -->
<div id="progress">
    <h1 id="msgs" style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">Loading GoldHEN v2.4b18.9... Please Wait</h1>
</div>

<!-- MENÚ DE HERRAMIENTAS (SE ACTIVA AL TERMINAR EL EXPLOIT) -->
<div id="menu" style="display: none">
    <h1 style="font-size: 18px;color: yellow;">System Tools</h1>
    <button class="btn" onclick="load_enableUpdates()"> Enable Updates </button>
    <button class="btn" onclick="load_disableUpdates()"> Disable Updates </button>
    
    <h1 style="font-size: 18px;">Hardware</h1>
    <button class="btn" onclick="load_fanthreshold()"> Fan Threshold </button>
    <select id="tempC" style="font-size:20px;height:35px;width:60px;"></select>°C
</div>

<script>
    var msgs = document.getElementById("msgs");
    
    // Configuración del selector de temperatura
    var select = document.getElementById("tempC");
    for(var i=40; i<=75; i=i+5){
        var option = document.createElement("option");
        option.text = i; option.value = i;
        select.add(option);
    }
    select.value="60";

    // ESTA FUNCIÓN LA LANZA ALERT.MJS AUTOMÁTICAMENTE
    window.jbdone = function() {
        document.getElementById("menu").style.display = "block";
        document.getElementById("progress").style.display = "none";
        msgs.innerHTML = "GoldHEN v2.4b18.9 Loaded!";
    };

    // LÓGICA MODERNA PARA CARGAR PAYLOADS (.BIN) EN PSFREE
    async function load_payload(file, msg) {
        msgs.innerHTML = "Loading " + file + "...";
        try {
            // Importamos el cargador que ya tienes en tu host
            const { sendPayload } = await import('./send.mjs');
            const response = await fetch(file);
            const buffer = await response.arrayBuffer();
            await sendPayload(buffer);
            msgs.innerHTML = msg;
        } catch (e) {
            msgs.innerHTML = "Error: Payload could not be loaded";
            console.error(e);
        }
    }

    function load_enableUpdates(){ load_payload("enable-updates.bin", "Enable Updates Loaded!"); }
    function load_disableUpdates(){ load_payload("disable-updates.bin", "Disable Updates Loaded!"); }
    function load_fanthreshold(){ load_payload("fan-threshold"+select.value+".bin", "Fan Threshold Set to "+select.value+"°C"); }
</script>

<!-- LANZADOR DEL EXPLOIT AUTOMÁTICO -->
<script type='module' src='alert.mjs'></script>
</body>
</html>
