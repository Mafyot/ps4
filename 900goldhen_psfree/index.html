<!DOCTYPE html>
<html>
<head>
<title>PS4 9.00 GoldHEN | Psfree + Lapse</title>
<link rel="stylesheet" href="../style.css">
<style>
    #progress {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #console { color: white; font-size: 10px; height: 50px; overflow: hidden; position: absolute; top: 0; }
</style>
</head>
<body>
<pre id="console"></pre>

<div id="progress">
    <h1 id="msgs" style="font-size: 30px;">Loading GoldHEN...</h1>
    <h2 id="status">Please Wait</h2>
</div>

<div id="menu">
    <h1 id="main-title">PS4 9.00 GoldHEN Tools</h1>
    <hr>
    <button class="btn" onclick="load_payload('enable-updates.bin', 'Updates Enabled!')"> Enable Updates </button>
    <button class="btn" onclick="load_payload('disable-updates.bin', 'Updates Disabled!')"> Disable Updates </button>
    <br><br>
    <button class="btn" onclick="load_fan()"> Fan Threshold </button>
    <select id="tempC" style="font-size:20px; height:35px; width:60px;"></select>°C
</div>

<script>
    var select = document.getElementById("tempC");
    for(var i=40; i<=75; i=i+5){
        var option = document.createElement("option");
        option.text = i; option.value = i;
        select.add(option);
    }
    select.value="60";

    // Quita la pantalla de carga
    window.jbdone = function() {
        document.getElementById("progress").style.display = "none";
    };

    // Respaldo por si el exploit no avisa al terminar
    setTimeout(function(){ if(window.jbdone) window.jbdone(); }, 10000);

    async function load_payload(file, successMsg) {
        document.getElementById("main-title").innerHTML = "Enviando " + file + "...";
        
        // BUSCAMOS EL INYECTOR EN VARIOS SITIOS POSIBLES
        var loader = window.chain || (window.main_chain) || (window.p && window.p.chain);

        if (loader && loader.run_payload) {
            try {
                const response = await fetch(file);
                const buffer = await response.arrayBuffer();
                await loader.run_payload(buffer);
                document.getElementById("main-title").innerHTML = successMsg;
            } catch (e) {
                alert("Error al leer el archivo .bin: " + file);
            }
        } else {
            alert("Error: Inyector no detectado todavía. Espera 5 segundos y vuelve a intentar.");
        }
    }

    function load_fan() {
        load_payload("fan-threshold" + select.value + ".bin", "Fan Set a " + select.value + "°C");
    }
</script>

<script type='module' src='alert.mjs'></script>
</body>
</html>
