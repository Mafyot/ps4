<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<meta charset="UTF-8">
<title>PS4 9.00 GoldHEN Host | Psfree + Lapse</title>
<link rel="stylesheet" href="../style.css">
<style>
    /* Diseño centrado y moderno */
    body {
        background-color: #161616;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    .main-container {
        text-align: center;
        width: 100%;
        max-width: 600px;
    }

    /* El recuadro del menú empieza oculto (display: none) */
    #menu-wrapper {
        display: none;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid #003791;
        border-radius: 20px;
        padding: 30px;
        margin: 20px auto;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .btn {
        background: linear-gradient(180deg, #004cc4 0%, #003791 100%);
        color: white;
        border: none;
        padding: 12px 25px;
        margin: 10px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        min-width: 200px;
    }

    .btn:hover {
        background: #005cf1;
    }

    select {
        background: #222;
        color: white;
        border: 1px solid #003791;
        padding: 10px;
        border-radius: 8px;
        font-size: 16px;
        margin-right: 10px;
        outline: none;
    }

    #msgs {
        font-size: 28px;
        font-weight: 300;
        color: #aaa;
        margin-top: 20px;
    }

    hr {
        width: 80%;
        border: 0.5px solid #333;
        margin: 20px auto;
    }

    .temp-section {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #444;
    }
</style>
</head>
<body>

<script>
    /* LÓGICA DE CACHÉ E HISTORIAL (ORIGINAL) */
    history.replaceState(null,null,'index.html');
    var histlength=history.length;
    history.go(-histlength);

    function DLProgress(e){
        Percent=(Math.round(e.loaded / e.total * 100));
        setTimeout(function(){window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";},500);
    }

    function DisplayCacheProgress(){
        setTimeout(function(){window.msgs.innerHTML="Cache Installed Successfully ✔";},1500);
        setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},3500);
    }

    window.applicationCache.addEventListener("progress",DLProgress,false);
    window.applicationCache.oncached=function(e){DisplayCacheProgress();};
    window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};

    /* FUNCIONES PARA EL MENÚ POST-EXPLOIT */
    
    // Esta función la llama el final del archivo lapse.mjs
    window.mostrarMenuFinal = function() {
        document.getElementById('menu-wrapper').style.display = 'block';
        window.msgs.innerHTML = "GoldHEN v2.4b18.9 Loaded Successfully ✔";
    };

            function enviarPayload(archivo) {
        // Mensaje inicial de carga en gris
        window.msgs.style.color = "#ccc";
        window.msgs.innerHTML = "Enviando Payload... Por favor, espere";
        
        try {
            // Ejecutamos la carga del payload
            if (typeof window.PayloadLoader === 'function') {
                window.PayloadLoader(archivo);
            } else {
                // Fallback si la función no está lista
                window.location.href = archivo;
            }

            // Tras 3 segundos, mostramos el éxito en VERDE sin el nombre del archivo
            setTimeout(function(){
                window.msgs.style.color = "#00ff00"; 
                window.msgs.innerHTML = "¡Se ha enviado con éxito! ✔";
            }, 3000);

        } catch(e) {
            // Por si ocurre algún error inesperado
            window.msgs.style.color = "#ff0000";
            window.msgs.innerHTML = "Error al intentar enviar el Payload";
            console.log(e);
        }
    }

    function aplicarTemp() {
        var grados = document.getElementById('tempSelect').value;
        var nombreBin = "fan-threshold" + grados + ".bin";
        enviarPayload(nombreBin);
    }
</script>

<div class="main-container">
    <pre id='console'></pre>
    <h1>PS4 9.00 GoldHEN Host</h1>
    <p style="color: #0081ff; margin:0;">Psfree + Lapse Edition</p>
    <hr>

    <!-- EL MENÚ QUE APARECERÁ DESPUÉS -->
    <div id="menu-wrapper">
        <button class="btn" onclick="enviarPayload('disable-updates.bin')">Disable Updates</button>
        
        <div class="temp-section">
            <p style="margin-bottom: 15px;">Control de Temperatura</p>
            <select id="tempSelect">
                <option value="40">40°C</option>
                <option value="45">45°C</option>
                <option value="50">50°C</option>
                <option value="55">55°C</option>
                <option value="60" selected>60°C</option>
                <option value="65">65°C</option>
                <option value="70">70°C</option>
                <option value="75">75°C</option>
            </select>
            <button class="btn" onclick="aplicarTemp()">Activar Temperatura</button>
        </div>
    </div>

    <!-- Mensaje de estado principal -->
    <h1 id="msgs">Wait a Moment...</h1>
</div>

<!-- Carga del exploit -->
<script type='module' src='alert.mjs'></script>

</body>
</html>
