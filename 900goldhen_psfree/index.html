<!DOCTYPE html>
<html>
<head>
<title>PS4 9.00 GoldHEN | Psfree + Lapse</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
if (window.applicationCache.status=='0'){window.location.replace("cache.html");}
</script>
<pre id='console'></pre>
<h1>PS4 9.00 GoldHEN | Psfree + Lapse</h1>
<hr>
<br>

<!-- PANTALLA DE CARGA INICIAL -->
<div id="progress">
    <h1 id="msgs" style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">Loading GoldHEN v2.4b18.9... Please Wait</h1>
</div>

<!-- MENÚ QUE SE ACTIVA AUTOMÁTICAMENTE -->
<div id="menu" style="display: none">
    <h1 style="font-size: 18px;color: yellow;">System Tools</h1>
    <button class="btn" onclick="load_enableUpdates()"> Enable Updates </button>
    <button class="btn" onclick="load_disableUpdates()"> Disable Updates </button>
    
    <h1 style="font-size: 18px;">Hardware</h1>
    <button class="btn" onclick="load_fanthreshold()"> Fan Threshold </button>
    <select id="tempC" style="font-size:20px;height:35px;width:60px;"></select>°C
</div>

<script>
    var msgs = document.getElementById("msgs");
    
    // Configuración del selector de temperatura
    var select = document.getElementById("tempC");
    for(var i=40; i<=75; i=i+5){
        var option = document.createElement("option");
        option.text = i; option.value = i;
        select.add(option);
    }
    select.value="60";

    // Esta función la activa alert.mjs al terminar el exploit
    window.jbdone = function() {
        document.getElementById("menu").style.display = "block";
        document.getElementById("progress").style.display = "none";
        msgs.innerHTML = "GoldHEN v2.4b18.9 Loaded!";
    };

    // Función para inyectar los .bin usando el motor de PSFree activo
    function load_payload(file, msg) {
        msgs.innerHTML = "Enviando " + file + "...";
        var xhr = new XMLHttpRequest();
        xhr.responseType = "arraybuffer";
        xhr.open('GET', file, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState == 4) {
                var PLD = xhr.response;
                // Usamos el objeto 'chain' que PSFree/Lapse dejan en el navegador
                if (window.chain) {
                    window.chain.run_payload(PLD);
                    msgs.innerHTML = msg;
                } else {
                    msgs.innerHTML = "Error: Inyector no detectado";
                }
            }
        };
        xhr.send();
    }

    function load_enableUpdates(){ load_payload("enable-updates.bin", "Updates Enabled!"); }
    function load_disableUpdates(){ load_payload("disable-updates.bin", "Updates Disabled!"); }
    function load_fanthreshold(){ load_payload("fan-threshold"+select.value+".bin", "Fan Set: "+select.value+"°C"); }
</script>

<!-- LANZADOR DEL EXPLOIT -->
<script type='module' src='alert.mjs'></script>
</body>
</html>
